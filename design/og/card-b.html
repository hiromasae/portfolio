<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<title>OG card B — work</title>
		<link rel="stylesheet" href="_card.css" />
		<style>
			/* ── Card B: the work ──
			   Same nav echo as A, then the projects grid instead of the hero. The
			   argument for this one is that the title text sitting beside the card
			   in a feed ALREADY says "Hiro Eernisse — Design Engineer": a card
			   that repeats the words earns nothing, and a card that shows three
			   pieces of work says the one thing the text can't.

			   The card idiom is ProjectCard.astro's, not a new one — title above
			   the image, 16/9 frame, 2px radius, --line border on a
			   --surface-sunken bed. Straight-on and unrotated: an angled
			   perspective deck hides the very screenshots it is showing off.

			   THE YEARS ARE GONE (2026-09-01, Hiro). They earn their line on the
			   site, where the grid is a body of work you scan chronologically.
			   They earn nothing here: all three read 2026, so the column repeated
			   one number three times and told the reader only that the work is
			   recent — which the card has no room to spend a line on. The title
			   is what a stranger is deciding on. */
			.grid {
				flex: 1;
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 28px;
				align-content: center;
				/* Bottom padding is an OPTICAL CENTRING SHIM, not a gap anyone
				   sees. True-centred, the block measured 116px of air above the
				   titles and 119px below the frames — even, and even reads as
				   low, because the masthead loads the top of the card and the eye
				   splits the difference above centre. 28px of bottom padding
				   lifts the block ~10px, which is the correction. It grew from
				   8px when the years came out: a shorter block sits in more air,
				   so it needed more of a lift, not the same one. */
				padding: 0 72px 28px;
			}

			.proj {
				display: flex;
				flex-direction: column;
				/* The real card runs gap-4 (1rem at a 19px root ≈ 16px) between the
				   metadata block and the frame. Held here so the rhythm matches. */
				gap: 17px;
				min-width: 0;
			}

			/* HEIGHT RESERVED FOR TWO TITLE LINES, always. On the site this block
			   is free-height and that is correct there — the grid's rows are far
			   apart and each card is read on its own. Packed into a 1200×630 card
			   the three sit shoulder to shoulder and get read as ONE row, so a
			   one-line title (EJS) floated its frame ~30px above its neighbours'
			   and the row lost its baseline. Reserving the taller of the two cases
			   puts every frame on one line; the shorter title just leaves air
			   under it, which nobody reads as a gap.

			   90px → 64px with the years gone (2026-09-01, Hiro): the reserve is
			   two title lines and nothing else now, so it tracks the title's own
			   line-height rather than carrying a dead 26px where the numeral was. */
			.meta {
				display: flex;
				flex-direction: column;
				min-height: 64px;
			}

			.title {
				font-size: 26px;
				font-weight: 400;
				line-height: 1.22;
				letter-spacing: -0.02em;
				color: var(--ink-title);
			}

			.frame {
				position: relative;
				width: 100%;
				aspect-ratio: 16 / 9;
				overflow: hidden;
				border-radius: var(--radius);
				border: 1px solid var(--line);
				background: var(--surface-sunken);
				background-clip: padding-box;
			}

			/* ── The masthead reads out in full ──
			   The bar's left slot held "HE" — the site's own wordmark, initials
			   since 2026-08-02. Spelled out with the descriptor attached it stops
			   being a mark and becomes a masthead: on a card seen once, by
			   someone who does not yet know the initials, two letters identify
			   nobody. The site can use "HE" because a visitor is already there.

			   OVERRIDES .mark rather than editing it in _card.css — card A still
			   opens on the initials, and that is right for A: the hero sentence
			   is already carrying the message, so the mark only has to sign it.

			   34px, not the mark's 46. The string went from two characters to
			   thirty-one, and holding the old size would have run it a third of
			   the way across the bar and made the identity line out-shout the
			   work below it, which is the one thing this card exists to show. */
			.mark {
				font-size: 34px;
				font-weight: 600;
				letter-spacing: -0.02em;
				color: var(--dye-name);
			}

			/* The initials keep the right-hand slot, where the spelled-out name
			   sat until the masthead took the words. Two green objects, but they
			   are not the same object twice — one names, one signs, and the bar
			   is bookended by the identity the way the site's nav is anchored by
			   it. Sized under the masthead deliberately: the mark is the echo
			   here, not the lead. */
			.mark-right {
				font-size: 30px;
				font-weight: 600;
				letter-spacing: -0.025em;
				color: var(--dye-name);
			}

			.frame img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: top;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="bar">
				<span class="mark">Hiro Eernisse — Design Engineer</span>
				<span class="mark-right" hidden>HE</span>
			</div>
			<div class="rule"></div>
			<div class="grid">
				<div class="proj">
					<div class="meta">
						<span class="title">migaki: Design Sense for Coding Agents</span>
					</div>
					<div class="frame">
						<img src="../../public/images/migaki0.webp" alt="" />
					</div>
				</div>
				<div class="proj">
					<div class="meta">
						<span class="title">EJS: Landing Page Facelift</span>
					</div>
					<div class="frame">
						<img src="../../public/images/ejs0.webp" alt="" />
					</div>
				</div>
				<div class="proj">
					<div class="meta">
						<span class="title">Stacksmith: AI Tool Stack Discovery</span>
					</div>
					<div class="frame">
						<img src="../../public/images/stacksmith1.png" alt="" />
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
